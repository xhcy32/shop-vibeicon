<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeIcon — Мода приходит и уходит, а твой стиль остаётся</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка: логотип + название + меню -->
<header class="site-header">
  <div class="container header-inner">
    <div class="logo">VibeIcon</div>
  
  <!-- Кнопка-бургер -->
  <button class="burger-btn" aria-label="Открыть меню">
    <span></span><span></span><span></span>
  </button>
  
  <!-- Само выпадающее меню -->
  <div class="mobile-menu">
    <a href="index.html" class="mobile-link">Главная</a>
    <a href="catalog.html" class="mobile-link">Каталог</a>
    <a href="about.html" class="mobile-link">О нас</a>
    <a href="buyers.html" class="mobile-link">Покупателям</a>
  </div>
</div>

  <!-- Главный экран -->
  <section class="hero">
    <div class="container hero-text">
      <h1>Мода приходит и уходит, а твой стиль остаётся</h1>
      <a href="catalog.html" class="btn">Смотреть коллекцию</a>
    </div>
  </section>

  <!-- Быстрые ссылки на разделы -->
  <section class="container sections-grid">
    <a href="catalog.html" class="section-card">
      <h3>Каталог</h3>
      <p>Футболки</p>
    </a><a href="about.html" class="section-card">
  <h3>О нас</h3>
  <p>Простые линии...</p>
</a>

<a href="buyers.html" class="section-card">
  <h3>Покупателям</h3>
  <p>Скидки, промокоды...</p>
</a>
  </section>

  <footer class="site-footer">
    <div class="container footer-text">
      © 2026 VibeIcon · Одежда для жизни
    </div>
  </footer>
<script>
  const burger = document.querySelector('.burger-btn');
  const menu = document.querySelector('.mobile-menu');

  if (burger && menu) {
    burger.addEventListener('click', () => {
      burger.classList.toggle('active');
      menu.classList.toggle('open');
    });
  }
</script>

</body>
</html>
